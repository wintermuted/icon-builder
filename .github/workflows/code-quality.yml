name: Code quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.1"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint with Oxlint
        run: npm run lint

      - name: Verify the source file length boundary
        run: npm run test:file-size

      - name: Check formatting with Oxfmt
        run: npm run format:check

      - name: Build the real browser bundle
        run: npm run nx -- run preview-app:build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify preview editor behavior
        run: npm run test:preview
        env:
          PREVIEW_TEST_BUNDLE: "1"
